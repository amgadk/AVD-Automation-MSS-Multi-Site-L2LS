---
# L3 Spine Switches (L3 gateway layer - hosts SVIs)
l3spine:
  defaults:
    platform: vEOS-lab
    bgp_as: 65000
    loopback_ipv4_pool: 10.255.10.0/24
    mlag_interfaces: [Ethernet15, Ethernet16]
    mlag_peer_ipv4_pool: 10.110.1.0/22
    mlag_peer_l3_ipv4_pool: 10.210.4.0/22
    virtual_router_mac_address: 00:1c:73:00:00:99
  node_groups:
    - group: c1-spines
      mlag: true
      nodes:
        - name: c1-spine1
          id: 100
          mgmt_ip: 192.168.0.111/24
        - name: c1-spine2
          id: 101
          mgmt_ip: 192.168.0.112/24

# Leaf switches - pure L2 access layer
l2leaf:
  defaults:
    platform: vEOS-lab
    uplink_interfaces: [Ethernet1, Ethernet2]
    uplink_switches: [c1-spine1, c1-spine2]
    mlag_interfaces: [Ethernet5, Ethernet6]
    mlag_peer_ipv4_pool: 10.110.10.0/22
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    mlag: true
  node_groups:
    - group: mlag1
      nodes:
        - name: c1-leaf1
          id: 103
          mgmt_ip: 192.168.0.101/24
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: c1-leaf2
          id: 104
          mgmt_ip: 192.168.0.102/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
    - group: mlag2
      nodes:
        - name: c1-leaf3
          id: 105
          mgmt_ip: 192.168.0.103/24
          uplink_switch_interfaces: [Ethernet3, Ethernet3]
        - name: c1-leaf4
          id: 106
          mgmt_ip: 192.168.0.104/24
          uplink_switch_interfaces: [Ethernet4, Ethernet4]
    - group: mlag3
      nodes:
        - name: c1-leaf5
          id: 107
          mgmt_ip: 192.168.0.105/24
          uplink_switch_interfaces: [Ethernet5, Ethernet5]
        - name: c1-leaf6
          id: 108
          mgmt_ip: 192.168.0.106/24
          uplink_switch_interfaces: [Ethernet6, Ethernet6]
    - group: c1-borderleafs
      nodes:
        - name: c1-borderleaf1
          id: 109
          mgmt_ip: 192.168.0.107/24
          uplink_switch_interfaces: [Ethernet7, Ethernet7]
        - name: c1-borderleaf2
          id: 110
          mgmt_ip: 192.168.0.108/24
          uplink_switch_interfaces: [Ethernet8, Ethernet8]
